  <g transform="translate(545, 560)"><ellipse cx="110" cy="24" rx="105" ry="22" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.5" /><text x="110" y="29" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#001A4D">Submit Financial Liquidation</text></g>
  <g transform="translate(545, 650)"><ellipse cx="110" cy="26" rx="105" ry="24" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.5" /><text x="110" y="24" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#001A4D">Request &amp; Generate</text><text x="110" y="38" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#001A4D">Certificates</text></g>
  <g transform="translate(210, 745)"><ellipse cx="110" cy="24" rx="105" ry="22" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.5" /><text x="110" y="29" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#001A4D">Post Announcements</text></g>

