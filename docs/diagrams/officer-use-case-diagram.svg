<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arr-open" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#333333" stroke-width="1.8" />
    </marker>
  </defs>

  <text x="600" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">STI Sync - Student Organization Officer Use Case Diagram</text>

  <!-- Boundary Box -->
  <rect x="180" y="48" width="980" height="810" rx="0" ry="0" fill="none" stroke="#000000" stroke-width="1.5" />
  <text x="600" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">STI Sync Web - Officer Subsystem Boundary</text>

  <!-- Actor (Middle Left) -->
  <g id="act_officer" transform="translate(45, 430)">
    <circle cx="35" cy="22" r="16" fill="#E1D5E7" stroke="#9673A6" stroke-width="1.5" />
    <line x1="35" y1="38" x2="35" y2="76" stroke="#333333" stroke-width="1.8" />
    <line x1="14" y1="50" x2="56" y2="50" stroke="#333333" stroke-width="1.8" />
    <line x1="35" y1="76" x2="18" y2="108" stroke="#333333" stroke-width="1.8" />
    <line x1="35" y1="76" x2="52" y2="108" stroke="#333333" stroke-width="1.8" />
    <text x="35" y="125" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#000000">Organization Officer</text>
    <text x="35" y="140" text-anchor="middle" font-size="11" fill="#333333">(Web Portal)</text>
  </g>

  <!-- EXTENDED USE CASES (Yellow Ovals - Left Column) -->
  <g transform="translate(210, 240)">
    <ellipse cx="110" cy="26" rx="105" ry="24" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.5" />
    <text x="110" y="16" text-anchor="middle" font-size="10.5" fill="#856404">«extend»</text>
    <text x="110" y="30" text-anchor="middle" font-size="11" fill="#000000">Appoint / Promote Member</text>
    <text x="110" y="42" text-anchor="middle" font-size="10" fill="#000000">to Officer Position</text>
  </g>
  <g transform="translate(210, 480)">
    <ellipse cx="110" cy="26" rx="105" ry="24" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.5" />
    <text x="110" y="16" text-anchor="middle" font-size="10.5" fill="#856404">«extend»</text>
    <text x="110" y="30" text-anchor="middle" font-size="11" fill="#000000">Manual Gate Ticket</text>
    <text x="110" y="42" text-anchor="middle" font-size="10" fill="#000000">Override Unlock</text>
  </g>
  <g transform="translate(210, 560)">
    <ellipse cx="110" cy="26" rx="105" ry="24" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.5" />
    <text x="110" y="16" text-anchor="middle" font-size="10.5" fill="#856404">«extend»</text>
    <text x="110" y="30" text-anchor="middle" font-size="11" fill="#000000">Resubmit Revised</text>
    <text x="110" y="42" text-anchor="middle" font-size="10" fill="#000000">Liquidation Report</text>
  </g>

  <!-- BASE USE CASES (Blue Ovals) -->
