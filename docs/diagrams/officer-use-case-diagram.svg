  <g transform="translate(885, 195)"><ellipse cx="110" cy="26" rx="105" ry="24" fill="#F8CECC" stroke="#B85450" stroke-width="1.5" /><text x="110" y="16" text-anchor="middle" font-size="10.5" fill="#900C3F">«include»</text><text x="110" y="30" text-anchor="middle" font-size="11" fill="#000000">Assign Scanners from</text><text x="110" y="42" text-anchor="middle" font-size="10" fill="#000000">Club Officer Roster</text></g>
  <g transform="translate(885, 330)"><ellipse cx="110" cy="26" rx="105" ry="24" fill="#F8CECC" stroke="#B85450" stroke-width="1.5" /><text x="110" y="16" text-anchor="middle" font-size="10.5" fill="#900C3F">«include»</text><text x="110" y="30" text-anchor="middle" font-size="11" fill="#000000">Batch Generate</text><text x="110" y="42" text-anchor="middle" font-size="10" fill="#000000">Payable Documents</text></g>
  <g transform="translate(885, 410)"><ellipse cx="110" cy="26" rx="105" ry="24" fill="#F8CECC" stroke="#B85450" stroke-width="1.5" /><text x="110" y="16" text-anchor="middle" font-size="10.5" fill="#900C3F">«include»</text><text x="110" y="30" text-anchor="middle" font-size="11" fill="#000000">Unlock Student Mobile</text><text x="110" y="42" text-anchor="middle" font-size="10" fill="#000000">QR Gate Ticket</text></g>
  <g transform="translate(885, 560)"><ellipse cx="110" cy="26" rx="105" ry="24" fill="#F8CECC" stroke="#B85450" stroke-width="1.5" /><text x="110" y="16" text-anchor="middle" font-size="10.5" fill="#900C3F">«include»</text><text x="110" y="30" text-anchor="middle" font-size="11" fill="#000000">Upload Expense Receipts</text><text x="110" y="42" text-anchor="middle" font-size="10" fill="#000000">to Cloudinary</text></g>
  <g transform="translate(885, 650)"><ellipse cx="110" cy="26" rx="105" ry="24" fill="#F8CECC" stroke="#B85450" stroke-width="1.5" /><text x="110" y="16" text-anchor="middle" font-size="10.5" fill="#900C3F">«include»</text><text x="110" y="30" text-anchor="middle" font-size="11" fill="#000000">Filter Verified Present</text><text x="110" y="42" text-anchor="middle" font-size="10" fill="#000000">Attendees Only</text></g>

