  <g transform="translate(545, 160)"><ellipse cx="110" cy="26" rx="105" ry="24" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.5" /><text x="110" y="31" text-anchor="middle" font-size="12" font-weight="bold" fill="#001A4D">Create Event Proposal</text></g>
