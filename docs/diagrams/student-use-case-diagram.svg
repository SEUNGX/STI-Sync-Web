  <g transform="translate(885, 640)"><ellipse cx="110" cy="26" rx="105" ry="24" fill="#F8CECC" stroke="#B85450" stroke-width="1.5" /><text x="110" y="16" text-anchor="middle" font-size="10.5" fill="#900C3F">«include»</text><text x="110" y="30" text-anchor="middle" font-size="11" fill="#000000">Verify Certificate QR</text><text x="110" y="42" text-anchor="middle" font-size="10" fill="#000000">Code Authenticity</text></g>

